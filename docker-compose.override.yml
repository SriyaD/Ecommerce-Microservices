services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  discountdb:
    container_name: discountdb
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password@1
      POSTGRES_DB: DiscountDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  orderdb:
    container_name: orderdb
    restart: always
    environment:
      SA_PASSWORD: "Sriya1234567"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - orderdb-data:/var/opt/mssql
  identitydb:
    container_name: identitydb
    restart: always
    environment:
      SA_PASSWORD: "Sriya1234567"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - identitydb-data:/var/opt/mssql
  
  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  pgadmin:
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.net
      PGADMIN_DEFAULT_PASSWORD: Password@1
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin
  portainer:
    container_name: portainer
    restart: always
    ports:
      - "8080:8000"
      - "9090:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  catalog:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__ConnectionString=mongodb://catalogdb:27017"
      - "DatabaseSettings__DatabaseName=CatalogDb"
      - "DatabaseSettings__ProductCollectionName=Products"
      - "DatabaseSettings__BrandCollectionName=Brands"
      - "DatabaseSettings__TypeCollectionName=Types"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - catalogdb
    ports:
      - "8000:8080"

  basket:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"
      - "GrpcSettings__DiscountUrl=http://discount:8080"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - basketdb
      - rabbitmq
    ports:
      - "8001:8080"

  discount:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;User Id=admin;Password=Password@1;"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - discountdb
    ports:
      - "8002:8080"
  ordering:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__OrderingConnectionString=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=Sriya1234567;TrustServerCertificate=True"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - orderdb
      - rabbitmq
    ports:
      - "8003:8080"
  payment:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    ports:
      - "8004:8080"
  identity:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__IdentityConnection=Server=identitydb,1433;Database=IdentityDb;User Id=sa;Password=Sriya1234567;TrustServerCertificate=True;"
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
      - "Jwt__DurationInMinutes=60"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - identitydb
    ports:
      - "8005:8080"

  ocelot.apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
    depends_on:
      - identity
      - catalog
      - basket
      - ordering
      - payment
      - discount
    ports:
      - "8010:8080"
  elasticsearch:
    container_name: elasticsearch
    environment: 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    ports:
      - "9200:9200"
    volumes:
    - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    environment: 
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
